his page reads a laboratory\u2019s source databases to this server, checks each request, and lists the requests the check held back. A lab administrator uses it to bring a laboratory\u2019s past requests into OpenLDR. The server does the work, so you can leave the page while a source is read or a check runs.",tasksLabel:"Tasks",resultLabel:"Expected result:",sections:[{id:"before",title:"Before you start",lead:"An admin sets these up in the studio once. You need the lab_admin role to open this page.",blocks:[{para:["This plugin reads two kinds of laboratory source database, a lab system\u2019s and OpenLDR v1\u2019s. It decodes a lab system only for the sites it has a profile for. Today it has one profile: ",{ui:"check.site.tanzania"},". A lab-system site with no profile cannot be checked until one is added to the plugin."]},{steps:[["Add a SQL Server connector for each lab system\u2019s database, and one for an OpenLDR v1 database you want to import. Each becomes a source."],["If the site has an old repository, add a SQL Server connector for it too. It becomes the reference."],["Open ",{studio:"Settings"},", then ",{studio:"Connectors"},"."],["In the row menu of each connector, choose ",{studio:"Plugin access"}," and allow this plugin."]]},{result:["the connectors are offered under ",{ui:"source.label"}," when you add a source or reference."]},{para:["Each connector holds one source or reference. To start over on a connector, remove what it holds first."]}]},{id:"copy-source",title:"Add a source",lead:"Do this first. A check needs a finished source.",blocks:[{steps:[["Open the ",{ui:"tab.copy"}," tab."],["Open the dots menu at the right end of the tab line and select ",{ui:"copy.new"},"."],["Under ",{ui:"source.label"},", choose the connector for the lab system\u2019s database."],["Under ",{ui:"options.role"},", choose ",{ui:"options.role.source"},". Under ",{ui:"options.kind"},", choose ",{ui:"options.kind.labSystem"},"."],["Leave ",{ui:"options.dataDb"},", ",{ui:"options.globalDb"}," and ",{ui:"options.dictDb"}," empty to use the plugin\u2019s default names, or type the names your site uses."],["To test the link first, open the dots menu at the top of the sheet and select ",{ui:"source.check"},"."],["Open the dots menu at the top of the sheet and select ",{ui:"copy.start"},"."]]},{result:["the sheet closes and the source is a row in the table. Its ",{ui:"copy.col.status"}," goes to ",{ui:"copy.status.running"},", then to ",{ui:"copy.status.completed"},"."]},{para:["A large database can take hours or days to read. You can close the page, and the reading carries on. To see each set of rows it reads, open the row\u2019s dots menu and select ",{ui:"copy.open"},"."]},{para:["Add one source for each lab system of the site. Each is compared with the site\u2019s one reference."]}]},{id:"copy-v1",title:"Add an OpenLDR v1 source",lead:"Use this to import from an OpenLDR v1 database itself. An OpenLDR v1 source is not compared with anything. A site with a reference cannot have one. Skip this task if the site has a reference.",blocks:[{steps:[["Open the ",{ui:"tab.copy"}," tab."],["Open the dots menu at the right end of the tab line and select ",{ui:"copy.new"},"."],["Under ",{ui:"source.label"},", choose the connector for the OpenLDR v1 database."],["Under ",{ui:"options.role"},", choose ",{ui:"options.role.source"},". Under ",{ui:"options.kind"},", choose ",{ui:"options.kind.openldrV1"},". If it cannot be chosen, the line under it says why."],["Leave ",{ui:"options.database"}," empty to use ",{code:"OpenLDRData"},", or type the name of the database."],["Both tables are read by default. Turn off ",{ui:"options.hasPatients"}," or ",{ui:"options.hasAst"}," when the database has no such table."],["Open the dots menu at the top of the sheet and select ",{ui:"copy.start"},"."]]},{result:["the sheet closes and the source is a row in the table. Its ",{ui:"copy.col.kind"}," shows ",{ui:"options.kind.openldrV1"},", and its ",{ui:"copy.col.status"}," goes to ",{ui:"copy.status.running"},", then to ",{ui:"copy.status.completed"},"."]},{para:["If the read fails because a table is missing, the row shows the error and this line: ",{ui:"copy.v1ReadHint"}," To remove the source, open the row\u2019s dots menu and select ",{ui:"copy.delete"},"."]},{para:["A check on this source does not compare it, so the Breakdown says ",{ui:"check.v1NotCompared"}," and lists only the requests held back. A request with its dates out of order is held back. It is listed on the ",{ui:"tab.held"}," tab, with a finding that names the dates."]}]},{id:"copy-reference",title:"Add the reference",lead:"The reference is OpenLDR v1, the old repository. It holds the same requests, and the check compares each source\u2019s requests with it. Skip this task if the site has no old repository.",blocks:[{steps:[["On the ",{ui:"tab.copy"}," tab, open the dots menu on the tab line and select ",{ui:"copy.new"},"."],["Under ",{ui:"source.label"},", choose the connector for the old repository."],["Under ",{ui:"options.role"},", choose ",{ui:"options.role.reference"},". Under ",{ui:"options.kind"},", ",{ui:"options.kind.openldrV1"}," is the only choice."],["Leave ",{ui:"options.v1Db"}," empty to use the plugin\u2019s default name, or type the name."],["In ",{ui:"options.requestIdPrefix"},", type the start of the request ids to read, such as ",{code:"ABC"},"."],["Open the dots menu at the top of the sheet and select ",{ui:"copy.start"},"."]]},{result:["a new row shows ",{ui:"check.reference"}," under ",{ui:"copy.col.role"},"."]},{para:["A site has at most one reference. If ",{ui:"options.role.reference"}," cannot be chosen, the line under it says why. Without a reference, nothing is compared, and a request that is not held back is labelled ",{ui:"label.unchecked"},". A site with an OpenLDR v1 source cannot have a reference."]}]},{id:"run-check",title:"Run a check",lead:"The check reads a finished source and has the plugin decode each request. It saves the requests that pass and holds back the rest.",blocks:[{steps:[["Open the ",{ui:"tab.check"}," tab."],["Under ",{ui:"check.source"},", choose the source. Only finished sources are offered. You can choose another one while a check runs, to see its check."],["Under it, ",{ui:"check.reference"}," names the site\u2019s reference. With none, it says ",{ui:"check.referenceNone"}," You do not choose the reference: every check uses the site\u2019s one reference."],["Open the dots menu on the tab line and select ",{ui:"check.settings"},"."],["Under ",{ui:"check.opt.site"},", choose your site\u2019s profile. The page offers only the profiles the plugin has."],["Type the ",{ui:"check.opt.labCode"},". Each source has its own code. The ",{ui:"check.opt.labName"}," is optional."],["In ",{ui:"check.opt.tz"},", type the laboratory\u2019s offset from UTC, such as ",{code:"+03:00"},"."],["Check that ",{ui:"check.opt.requestIdPrefix"}," is the prefix the reference was read with. The page fills it in from the reference."],["Open the dots menu at the top of the sheet and select ",{ui:"check.start"},"."]]},{result:["the status line shows ",{ui:"check.status.running"}," and how many requests are read, then ",{ui:"check.status.completed"},"."]},{para:["For an OpenLDR v1 source, the ",{ui:"check.reference"}," field reads ",{ui:"check.referenceNotApplicable"}," and cannot be changed, and the settings ask for the ",{ui:"check.opt.tz"}," only."]},{para:["If the old repository writes the place of care with the district first, choose ",{ui:"check.poc.district_facility_ward"}," under ",{ui:"check.opt.pocFormat"}," before you start."]},{para:["To stop a check, open the dots menu on the tab line and select ",{ui:"check.stop"},". It stops after the page of requests it is reading."]},{para:["Once a check has finished, the menu offers ",{ui:"check.restart"}," in place of ",{ui:"check.start"},". It runs the check again over the same source, with the options in the form. The source database is not read again. A request that passes this time is saved and leaves the held list."]},{para:["Once a check has stopped or failed, the menu offers ",{ui:"check.continue"}," and ",{ui:"check.restartFromFirst"},". ",{ui:"check.continue"}," carries on from where the check stopped, and keeps its counts and its held requests. ",{ui:"check.restartFromFirst"}," begins at the first request, with fresh counts. A check also begins at the first request when its options or the reference changed, or when the source or the reference was read again. After a start, the tab says which happened."]}]},{id:"read-counts",title:"Read the counts",lead:"The counts cover the whole source, or one laboratory when you choose one.",blocks:[{para:["A ",{ui:"check.lab.label"}," picker appears above the counts only when OpenLDR reports counts for each laboratory. Tap it to find and select a laboratory on desktop or phone. Choose ",{ui:"check.lab.all"}," for the totals of the whole source. ",{ui:"check.lab.unassigned"}," keeps requests with no laboratory code separate. Without those counts, the page shows the totals of the whole source and no picker."]},{terms:[{term:[{ui:"check.count.read"}],text:["The check has read this many requests from the source so far."]},{term:[{ui:"check.count.saved"}],text:["These requests passed and are saved in OpenLDR."]},{term:[{ui:"check.count.held"}],text:["These requests are not saved. Each is kept, with why, on the ",{ui:"tab.held"}," tab."]},{term:[{ui:"check.count.failed"}],text:["The plugin could not decode these requests, or OpenLDR could not save them. A request the plugin could not decode is listed on the ",{ui:"tab.held"}," tab with an error code."]}]},{para:["The ",{ui:"check.labelsHeading"}," sorts the requests by what the check found:"]},{terms:[{term:[{ui:"label.passed"}],text:["The rules found no error, and the request matches the reference."]},{term:[{ui:"label.unchecked"}],text:["The rules found no error, and the request is saved. It was not compared: the site has no reference, or the reference has no matching request."]},{term:[{ui:"label.held_rules"}],text:["The plugin\u2019s rules found an error in the request."]},{term:[{ui:"label.held_check"}],text:["The request differs from the reference."]},{term:[{ui:"label.held_both"}],text:["The rules found an error, and the request differs from the reference."]},{term:[{ui:"label.other"}],text:["Any further labels, counted together."]}]},{para:["A saved request can still have findings that did not hold it back: a warning or a note. OpenLDR keeps them with the request, as two request attributes: v1-flags names the kinds of finding, and v1-findings holds each finding in full. Use them to find saved requests worth a second look."]}]},{id:"held",title:"Work through held requests",lead:"Do this after a check, to see why each request was held back.",blocks:[{steps:[["Open the ",{ui:"tab.held"}," tab."],["In the first list above the table, choose the source."],["To see one reason only, choose it in the second list, such as ",{ui:"label.held_check"}," or ",{ui:"held.filter.error"},". When OpenLDR counts by laboratory, a third list, ",{ui:"check.lab.label"},", shows one laboratory\u2019s requests."],["Select a request id in the ",{ui:"held.col.request"}," column."],["Read the ",{ui:"held.findings"},". Each has a severity, a message and the values it saw."],["Read ",{ui:"held.check"},". The fields that differ come first."],["To hide the fields that are the same, tick ",{ui:"held.onlyDiff"},"."]]},{result:["the sheet shows why the request was held and where it differs from the reference. Close the sheet to go back to the same row."]},{para:["Under ",{ui:"held.results"},", each test result is compared the same way, differences first. While a check runs, the list is read again by itself. To read it again now, open the dots menu on the tab line and select ",{ui:"held.refresh"},"."]},{para:["To correct a field, open the dots menu of the sheet and select ",{ui:"held.correct.open"},". Each field shows its value as read. Change the values, give a reason, then select ",{ui:"held.correct.save"}," in the same menu. The source rows are not changed. The request is saved only if it now passes the rules. A person with the Correct held requests permission sees only this tab."]}]},{id:"share",title:"Share what was held",lead:"Each export saves a CSV file. Open the dots menu, select the export, and keep the file. The exports of held requests follow the lists above the table. With a laboratory chosen, the file name holds its code. While the check of the source runs, the page refuses these exports: wait for it to finish, or stop it.",blocks:[{terms:[{term:[{ui:"export.summary"}],text:["In the ",{ui:"tab.check"}," tab\u2019s menu. The four counts, the breakdown, the status, the start and finish times, the source, the reference and the check options. This export always covers the whole source, even when one laboratory is selected. When OpenLDR counts by laboratory, it adds one row for each laboratory."]},{term:[{ui:"export.list"}],text:["In the ",{ui:"tab.held"}," tab\u2019s menu. One row per held request under the reason and laboratory you chose: the request id, why, the error code and when it was held."]},{term:[{ui:"export.page"}],text:["In the ",{ui:"tab.held"}," tab\u2019s menu. The findings of the requests on the page you see, with only the fields and results that differ."]},{term:[{ui:"export.all"}],text:["In the ",{ui:"tab.held"}," tab\u2019s menu. The same, for every held request under the reason and laboratory you chose. Above 50,000 requests the page asks first. Select ",{ui:"export.bigYes"}," to go on, or ",{ui:"copy.cancel"}," to stop. While the export reads, the dots menu offers ",{ui:"export.cancel"},". Select it to stop. Nothing is saved then."]},{term:[{ui:"export.request"}],text:["In the dots menu of an open request. Its findings, and every field and result of the check, those that match included."]}]},{para:["These files hold patient values. Keep them as you keep any patient record, and share them only with people allowed to see them."]},{para:["If the menu offers no export, this OpenLDR cannot save files yet."]}]},{id:"stops",title:"When something stops",lead:"Most stops clear by themselves. The page says which.",blocks:[{terms:[{term:[{ui:"copy.status.waiting"}],text:["The reading lost its link to the database. It waits and tries again by itself, and the row shows the tries so far. If it waits a long time, ask an admin to run ",{studio:"Diagnose"}," on the connector."]},{term:[{ui:"copy.status.failed"}],text:["The row shows the last error. Fix the cause, then open the row\u2019s dots menu and select ",{ui:"copy.readAgain"},". The reading carries on from where it stopped. It does not read finished sets again."]},{term:[{ui:"copy.status.completedSkipped"}],text:["Some keys could not be read. They are tried again at the end of each pass and each time the reading starts. To try them now, select ",{ui:"copy.readAgain"}," in the row\u2019s menu. Only those keys are read again from the database."]},{term:[{ui:"check.status.waiting"}],text:["The server had a database fault. The check waits and tries the same page again, up to 5 times. You need do nothing."]},{term:[{ui:"check.status.failed"}],text:["The check stopped, for a database fault that did not clear after 5 tries or for another cause. A message shows the last error. Fix the cause, then select ",{ui:"check.continue"},". It carries on from where it stopped."]},{term:["The server restarted"],text:["You need do nothing. A reading carries on by itself, and a check picks up again after about two minutes."]},{term:[{ui:"check.startError"}],text:["The server refused the start, and the message says why. A check starts only on a finished source, with a finished reference or none. After an upgrade of the plugin that changed what is read, the source must be read again first. See ",{see:"after-fix",text:"After a fix to the plugin"},"."]},{term:[{ui:"run.actionError"}],text:["A source or the reference cannot be read again or removed while a check that uses it runs. Wait for the check to end, or stop it on the ",{ui:"tab.check"}," tab."]},{term:[{ui:"check.referencesMany"}],text:["This happens only where references were added before a site could hold just one. The tab does not choose between them."]},{term:[{ui:"check.noOps"}],text:["Ask an admin to upgrade OpenLDR."]},{term:[{ui:"copy.allTaken"}],text:["The menu still offers ",{ui:"copy.new"},", but its sheet lists no connector. It says every allowed connector is in use. Remove one, or ask an admin to allow another connector."]}]}]},{id:"after-fix",title:"After a fix to the plugin",lead:"When a new version of the plugin fixes how requests are decoded or which rules hold them, run the check again over the same source. The source is not read again. A new version that changes what the plugin reads is different: a check refuses the source until it is read again from its database. Only the sets whose statements changed are read again.",blocks:[{steps:[["Ask an admin to install the new version of the plugin."],["Open the ",{ui:"tab.check"}," tab."],["Under ",{ui:"check.source"},", choose the source."],["Open the dots menu on the tab line and select ",{ui:"check.restart"},"."]]},{result:["the check runs again over the same source. A request that passes now is saved."]},{para:["If the start is refused because the source must be read again, open the ",{ui:"tab.copy"}," tab. In the row\u2019s dots menu, select ",{ui:"copy.readAgain"},". The page asks ",{ui:"copy.rereadTitle"}," and lists the sets whose statements changed. Select ",{ui:"copy.rereadYes"}," to confirm. This deletes the rows read for those sets and reads them from the database again. For a large database that can take hours or days. When the source shows ",{ui:"copy.status.completed"},", start the check again."]}]}]};var _1={title:"Ce que fait cette page",summary:"Cette page lit les bases de donn\xE9es sources d\u2019un laboratoire sur ce serveur, v\xE9rifie chaque demande et liste les demandes que la v\xE9rification a retenues. Un administrateur de laboratoire s\u2019en sert pour faire entrer dans OpenLDR les demandes pass\xE9es d\u2019un laboratoire. Le serveur fait le travail : vous pouvez quitter la page pendant la lecture d\u2019une source ou une v\xE9rification.",tasksLabel:"T\xE2ches",resultLabel:"R\xE9sultat attendu :",sections:[{id:"before",title:"Avant de commencer",lead:"Un administrateur pr\xE9pare ceci une fois dans le studio. Il vous faut le r\xF4le lab_admin pour ouvrir cette page.",blocks:[{para:["Ce plugin lit deux types de base de donn\xE9es source, celle d\u2019un syst\xE8me de laboratoire et celle d\u2019OpenLDR v1. Il ne d\xE9code un syst\xE8me de laboratoire que pour les sites dont il a un profil. Il en a un aujourd\u2019hui : ",{ui:"check.site.tanzania"},". Un site de syst\xE8me de laboratoire sans profil ne peut pas \xEAtre v\xE9rifi\xE9 tant qu\u2019un profil n\u2019a pas \xE9t\xE9 ajout\xE9 au plugin."]},{steps:[["Ajoutez un connecteur SQL Server pour la base de chaque syst\xE8me de laboratoire, et un pour une base OpenLDR v1 que vous voulez importer. Chacun devient une source."],["Si le site a un ancien entrep\xF4t, ajoutez aussi un connecteur SQL Server pour lui. Il devient la r\xE9f\xE9rence."],["Ouvrez ",{studio:"Param\xE8tres"},", puis ",{studio:"Connecteurs"},"."],["Dans le menu de la ligne de chaque connecteur, choisissez ",{studio:"Acc\xE8s des plugins"}," et autorisez ce plugin."]]},{result:["les connecteurs sont propos\xE9s sous ",{ui:"source.label"}," quand vous ajoutez une source ou une r\xE9f\xE9rence."]},{para:["Chaque connecteur contient une source ou une r\xE9f\xE9rence. Pour repartir de z\xE9ro sur un connecteur, supprimez d\u2019abord ce qu\u2019il contient."]}]},{id:"copy-source",title:"Ajouter une source",lead:"Commencez par l\xE0. Une v\xE9rification a besoin d\u2019une source termin\xE9e.",blocks:[{steps:[["Ouvrez l\u2019onglet ",{ui:"tab.copy"},"."],["Ouvrez le menu \xE0 trois points au bout de la ligne des onglets et choisissez ",{ui:"copy.new"},"."],["Sous ",{ui:"source.label"},", choisissez le connecteur de la base du syst\xE8me du laboratoire."],["Sous ",{ui:"options.role"},", choisissez ",{ui:"options.role.source"},". Sous ",{ui:"options.kind"},", choisissez ",{ui:"options.kind.labSystem"},"."],["Laissez ",{ui:"options.dataDb"},", ",{ui:"options.globalDb"}," et ",{ui:"options.dictDb"}," vides pour garder les noms par d\xE9faut du plugin, ou saisissez les noms de votre site."],["Pour tester d\u2019abord la connexion, ouvrez le menu \xE0 trois points en haut du panneau et choisissez ",{ui:"source.check"},"."],["Ouvrez le menu \xE0 trois points en haut du panneau et choisissez ",{ui:"copy.start"},"."]]},{result:["le panneau se ferme et la source appara\xEEt comme une ligne du tableau. Son ",{ui:"copy.col.status"}," passe \xE0 ",{ui:"copy.status.running"},", puis \xE0 ",{ui:"copy.status.completed"},"."]},{para:["Lire une grande base peut prendre des heures, voire des jours. Vous pouvez fermer la page, la lecture continue. Pour voir chaque ensemble de lignes lu, ouvrez le menu \xE0 trois points de la ligne et choisissez ",{ui:"copy.open"},"."]},{para:["Ajoutez une source pour chaque syst\xE8me de laboratoire du site. Chacune est compar\xE9e \xE0 l\u2019unique r\xE9f\xE9rence du site."]}]},{id:"copy-v1",title:"Ajouter une source OpenLDR v1",lead:"Utilisez ceci pour importer depuis une base OpenLDR v1 elle-m\xEAme. Une source OpenLDR v1 n\u2019est compar\xE9e \xE0 rien. Un site qui a une r\xE9f\xE9rence ne peut pas en avoir. Passez cette t\xE2che si le site a une r\xE9f\xE9rence.",blocks:[{steps:[["Ouvrez l\u2019onglet ",{ui:"tab.copy"},"."],["Ouvrez le menu \xE0 trois points au bout de la ligne des onglets et choisissez ",{ui:"copy.new"},"."],["Sous ",{ui:"source.label"},", choisissez le connecteur de la base OpenLDR v1."],["Sous ",{ui:"options.role"},", choisissez ",{ui:"options.role.source"},". Sous ",{ui:"options.kind"},", choisissez ",{ui:"options.kind.openldrV1"},". Si ce choix est impossible, la ligne en dessous dit pourquoi."],["Laissez ",{ui:"options.database"}," vide pour utiliser ",{code:"OpenLDRData"},", ou saisissez le nom de la base."],["Les deux tables sont lues par d\xE9faut. D\xE9sactivez ",{ui:"options.hasPatients"}," ou ",{ui:"options.hasAst"}," quand la base n\u2019a pas cette table."],["Ouvrez le menu \xE0 trois points en haut du panneau et choisissez ",{ui:"copy.start"},"."]]},{result:["le panneau se ferme et la source appara\xEEt comme une ligne du tableau. Sa colonne ",{ui:"copy.col.kind"}," affiche ",{ui:"options.kind.openldrV1"},", et son ",{ui:"copy.col.status"}," passe \xE0 ",{ui:"copy.status.running"},", puis \xE0 ",{ui:"copy.status.completed"},"."]},{para:["Si la lecture \xE9choue parce qu\u2019une table manque, la ligne affiche l\u2019erreur et cette phrase : ",{ui:"copy.v1ReadHint"}," Pour supprimer la source, ouvrez le menu \xE0 trois points de la ligne et choisissez ",{ui:"copy.delete"},"."]},{para:["Une v\xE9rification de cette source ne la compare pas : la R\xE9partition indique donc ",{ui:"check.v1NotCompared"}," et ne liste que les demandes retenues. Une demande dont les dates sont dans le d\xE9sordre est retenue. Elle est list\xE9e dans l\u2019onglet ",{ui:"tab.held"},", avec un constat qui nomme les dates."]}]},{id:"copy-reference",title:"Ajouter la r\xE9f\xE9rence",lead:"La r\xE9f\xE9rence est OpenLDR v1, l\u2019ancien entrep\xF4t. Elle contient les m\xEAmes demandes, et la v\xE9rification compare avec elle les demandes de chaque source. Passez cette t\xE2che si le site n\u2019a pas d\u2019ancien entrep\xF4t.",blocks:[{steps:[["Dans l\u2019onglet ",{ui:"tab.copy"},", ouvrez le menu \xE0 trois points de la ligne des onglets et choisissez ",{ui:"copy.new"},"."],["Sous ",{ui:"source.label"},", choisissez le connecteur de l\u2019ancien entrep\xF4t."],["Sous ",{ui:"options.role"},", choisissez ",{ui:"options.role.reference"},". Sous ",{ui:"options.kind"},", ",{ui:"options.kind.openldrV1"}," est le seul choix."],["Laissez ",{ui:"options.v1Db"}," vide pour garder le nom par d\xE9faut du plugin, ou saisissez le nom."],["Dans ",{ui:"options.requestIdPrefix"},", saisissez le d\xE9but des identifiants de demande \xE0 lire, par exemple ",{code:"ABC"},"."],["Ouvrez le menu \xE0 trois points en haut du panneau et choisissez ",{ui:"copy.start"},"."]]},{result:["une nouvelle ligne affiche ",{ui:"check.reference"}," dans la colonne ",{ui:"copy.col.role"},"."]},{para:["Un site a une r\xE9f\xE9rence au plus. Si ",{ui:"options.role.reference"}," ne peut pas \xEAtre choisie, la ligne en dessous dit pourquoi. Sans r\xE9f\xE9rence, rien n\u2019est compar\xE9, et une demande qui n\u2019est pas retenue re\xE7oit l\u2019\xE9tiquette ",{ui:"label.unchecked"},". Un site qui a une source OpenLDR v1 ne peut pas avoir de r\xE9f\xE9rence."]}]},{id:"run-check",title:"Lancer une v\xE9rification",lead:"La v\xE9rification lit une source termin\xE9e et fait d\xE9coder chaque demande par le plugin. Elle enregistre les demandes qui passent et retient les autres.",blocks:[{steps:[["Ouvrez l\u2019onglet ",{ui:"tab.check"},"."],["Sous ",{ui:"check.source"},", choisissez la source. Seules les sources termin\xE9es sont propos\xE9es. Vous pouvez en choisir une autre pendant une v\xE9rification, pour voir la sienne."],["En dessous, ",{ui:"check.reference"}," donne la r\xE9f\xE9rence du site. S\u2019il n\u2019y en a pas, la ligne dit ",{ui:"check.referenceNone"}," Vous ne choisissez pas la r\xE9f\xE9rence : chaque v\xE9rification utilise l\u2019unique r\xE9f\xE9rence du site."],["Ouvrez le menu \xE0 trois points de la ligne des onglets et choisissez ",{ui:"check.settings"},"."],["Sous ",{ui:"check.opt.site"},", choisissez le profil de votre site. La page ne propose que les profils que le plugin conna\xEEt."],["Saisissez le ",{ui:"check.opt.labCode"},". Chaque source a son propre code. Le ",{ui:"check.opt.labName"}," est facultatif."],["Dans ",{ui:"check.opt.tz"},", saisissez le d\xE9calage du laboratoire par rapport \xE0 UTC, par exemple ",{code:"+03:00"},"."],["V\xE9rifiez que ",{ui:"check.opt.requestIdPrefix"}," est le pr\xE9fixe avec lequel la r\xE9f\xE9rence a \xE9t\xE9 lue. La page le remplit \xE0 partir de la r\xE9f\xE9rence."],["Ouvrez le menu \xE0 trois points en haut du panneau et choisissez ",{ui:"check.start"},"."]]},{result:["la ligne d\u2019\xE9tat affiche ",{ui:"check.status.running"}," et le nombre de demandes lues, puis ",{ui:"check.status.completed"},"."]},{para:["Pour une source OpenLDR v1, le champ ",{ui:"check.reference"}," affiche ",{ui:"check.referenceNotApplicable"}," et ne peut pas \xEAtre modifi\xE9, et les param\xE8tres demandent seulement le ",{ui:"check.opt.tz"},"."]},{para:["Si l\u2019ancien entrep\xF4t \xE9crit le lieu de soins en commen\xE7ant par le district, choisissez ",{ui:"check.poc.district_facility_ward"}," sous ",{ui:"check.opt.pocFormat"}," avant de lancer."]},{para:["Pour arr\xEAter une v\xE9rification, ouvrez le menu \xE0 trois points de la ligne des onglets et choisissez ",{ui:"check.stop"},". Elle s\u2019arr\xEAte apr\xE8s la page de demandes en cours de lecture."]},{para:["Une fois la v\xE9rification termin\xE9e, le menu propose ",{ui:"check.restart"}," \xE0 la place de ",{ui:"check.start"},". La v\xE9rification repasse sur la m\xEAme source, avec les options du formulaire. La base source n\u2019est pas relue. Une demande qui passe cette fois est enregistr\xE9e et quitte la liste des retenues."]},{para:["Une fois la v\xE9rification arr\xEAt\xE9e ou en \xE9chec, le menu propose ",{ui:"check.continue"}," et ",{ui:"check.restartFromFirst"},". ",{ui:"check.continue"}," reprend l\xE0 o\xF9 la v\xE9rification s\u2019est arr\xEAt\xE9e, et garde ses compteurs et ses demandes retenues. ",{ui:"check.restartFromFirst"}," commence \xE0 la premi\xE8re demande, avec des compteurs remis \xE0 z\xE9ro. Une v\xE9rification commence aussi \xE0 la premi\xE8re demande quand ses options ou la r\xE9f\xE9rence ont chang\xE9, ou quand la source ou la r\xE9f\xE9rence a \xE9t\xE9 relue. Apr\xE8s un lancement, l\u2019onglet dit ce qui s\u2019est pass\xE9."]}]},{id:"read-counts",title:"Lire les compteurs",lead:"Les chiffres couvrent toute la source, ou un seul laboratoire quand vous en choisissez un.",blocks:[{para:["Le s\xE9lecteur ",{ui:"check.lab.label"}," appara\xEEt au-dessus des chiffres seulement quand OpenLDR fournit les chiffres de chaque laboratoire. Ouvrez-le pour rechercher et choisir un laboratoire sur ordinateur ou t\xE9l\xE9phone. Choisissez ",{ui:"check.lab.all"}," pour les totaux de toute la source. ",{ui:"check.lab.unassigned"}," regroupe les demandes sans code de laboratoire. Sans ces chiffres, la page affiche les totaux de toute la source, sans s\xE9lecteur."]},{terms:[{term:[{ui:"check.count.read"}],text:["Le nombre de demandes que la v\xE9rification a lues dans la source jusqu\u2019ici."]},{term:[{ui:"check.count.saved"}],text:["Ces demandes sont pass\xE9es et sont enregistr\xE9es dans OpenLDR."]},{term:[{ui:"check.count.held"}],text:["Ces demandes ne sont pas enregistr\xE9es. Chacune est gard\xE9e, avec son motif, dans l\u2019onglet ",{ui:"tab.held"},"."]},{term:[{ui:"check.count.failed"}],text:["Le plugin n\u2019a pas pu d\xE9coder ces demandes, ou OpenLDR n\u2019a pas pu les enregistrer. Une demande que le plugin n\u2019a pas pu d\xE9coder figure dans l\u2019onglet ",{ui:"tab.held"}," avec un code d\u2019erreur."]}]},{para:["La ",{ui:"check.labelsHeading"}," classe les demandes selon ce que la v\xE9rification a trouv\xE9 :"]},{terms:[{term:[{ui:"label.passed"}],text:["Les r\xE8gles n\u2019ont trouv\xE9 aucune erreur, et la demande correspond \xE0 la r\xE9f\xE9rence."]},{term:[{ui:"label.unchecked"}],text:["Les r\xE8gles n\u2019ont trouv\xE9 aucune erreur, et la demande est enregistr\xE9e. Elle n\u2019a pas \xE9t\xE9 compar\xE9e : le site n\u2019a pas de r\xE9f\xE9rence, ou la r\xE9f\xE9rence n\u2019a pas de demande correspondante."]},{term:[{ui:"label.held_rules"}],text:["Les r\xE8gles du plugin ont trouv\xE9 une erreur dans la demande."]},{term:[{ui:"label.held_check"}],text:["La demande diff\xE8re de la r\xE9f\xE9rence."]},{term:[{ui:"label.held_both"}],text:["Les r\xE8gles ont trouv\xE9 une erreur, et la demande diff\xE8re de la r\xE9f\xE9rence."]},{term:[{ui:"label.other"}],text:["Les autres \xE9tiquettes, compt\xE9es ensemble."]}]},{para:["Une demande enregistr\xE9e peut encore avoir des constats qui ne l\u2019ont pas retenue : un avertissement ou une note. OpenLDR les garde avec la demande, sous forme de deux attributs de demande : v1-flags nomme les types de constat, et v1-findings contient chaque constat en entier. Servez-vous-en pour retrouver les demandes enregistr\xE9es \xE0 revoir."]}]},{id:"held",title:"Traiter les demandes retenues",lead:"Faites-le apr\xE8s une v\xE9rification, pour voir pourquoi chaque demande a \xE9t\xE9 retenue.",blocks:[{steps:[["Ouvrez l\u2019onglet ",{ui:"tab.held"},"."],["Dans la premi\xE8re liste au-dessus du tableau, choisissez la source."],["Pour ne voir qu\u2019un motif, choisissez-le dans la seconde liste, par exemple ",{ui:"label.held_check"}," ou ",{ui:"held.filter.error"},". Quand OpenLDR compte par laboratoire, une troisi\xE8me liste, ",{ui:"check.lab.label"},", montre les demandes d\u2019un seul laboratoire."],["Choisissez un identifiant dans la colonne ",{ui:"held.col.request"},"."],["Lisez les ",{ui:"held.findings"},". Chacun a une gravit\xE9, un message et les valeurs relev\xE9es."],["Lisez ",{ui:"held.check"},". Les champs qui diff\xE8rent viennent en premier."],["Pour masquer les champs identiques, cochez ",{ui:"held.onlyDiff"},"."]]},{result:["le panneau montre pourquoi la demande a \xE9t\xE9 retenue et o\xF9 elle diff\xE8re de la r\xE9f\xE9rence. Fermez le panneau pour revenir \xE0 la m\xEAme ligne."]},{para:["Sous ",{ui:"held.results"},", chaque r\xE9sultat d\u2019analyse est compar\xE9 de la m\xEAme fa\xE7on, les diff\xE9rences en premier. Pendant une v\xE9rification, la liste se relit d\u2019elle-m\xEAme. Pour la relire tout de suite, ouvrez le menu \xE0 trois points de la ligne des onglets et choisissez ",{ui:"held.refresh"},"."]},{para:["Pour corriger un champ, ouvrez le menu \xE0 points de la fiche et choisissez ",{ui:"held.correct.open"},". Chaque champ montre sa valeur telle que lue. Changez les valeurs, donnez un motif, puis choisissez ",{ui:"held.correct.save"}," dans le m\xEAme menu. Les lignes de la source ne changent pas. La demande n\u2019est enregistr\xE9e que si elle passe les r\xE8gles. Une personne qui a la permission Corriger les demandes retenues ne voit que cet onglet."]}]},{id:"share",title:"Partager les retenues",lead:"Chaque export enregistre un fichier CSV. Ouvrez le menu \xE0 trois points, choisissez l\u2019export et gardez le fichier. Les exports des demandes retenues suivent les listes au-dessus du tableau. Si un laboratoire est choisi, le nom du fichier contient son code. Pendant que la v\xE9rification de la source tourne, la page refuse ces exports : attendez qu\u2019elle finisse, ou arr\xEAtez-la.",blocks:[{terms:[{term:[{ui:"export.summary"}],text:["Dans le menu de l\u2019onglet ",{ui:"tab.check"},". Les quatre compteurs, la r\xE9partition, le statut, les heures de d\xE9but et de fin, la source, la r\xE9f\xE9rence et les options de la v\xE9rification. Cet export couvre toujours toute la source, m\xEAme si un seul laboratoire est s\xE9lectionn\xE9. Quand OpenLDR compte par laboratoire, il ajoute une ligne par laboratoire."]},{term:[{ui:"export.list"}],text:["Dans le menu de l\u2019onglet ",{ui:"tab.held"},". Une ligne par demande retenue pour le motif et le laboratoire choisis : l\u2019identifiant, le motif, le code d\u2019erreur et le moment o\xF9 elle a \xE9t\xE9 retenue."]},{term:[{ui:"export.page"}],text:["Dans le menu de l\u2019onglet ",{ui:"tab.held"},". Les constats des demandes de la page affich\xE9e, avec seulement les champs et les r\xE9sultats qui diff\xE8rent."]},{term:[{ui:"export.all"}],text:["Dans le menu de l\u2019onglet ",{ui:"tab.held"},". La m\xEAme chose pour toutes les demandes retenues du motif et du laboratoire choisis. Au-del\xE0 de 50 000 demandes, la page demande d\u2019abord. Choisissez ",{ui:"export.bigYes"}," pour continuer, ou ",{ui:"copy.cancel"}," pour arr\xEAter. Pendant la lecture, le menu \xE0 trois points propose ",{ui:"export.cancel"},". Choisissez-le pour arr\xEAter. Rien n\u2019est alors enregistr\xE9."]},{term:[{ui:"export.request"}],text:["Dans le menu \xE0 trois points d\u2019une demande ouverte. Ses constats, et tous les champs et r\xE9sultats de la v\xE9rification, y compris ceux qui correspondent."]}]},{para:["Ces fichiers contiennent des donn\xE9es de patients. Gardez-les comme tout dossier de patient, et ne les partagez qu\u2019avec les personnes autoris\xE9es \xE0 les voir."]},{para:["Si le menu ne propose aucun export, cet OpenLDR ne sait pas encore enregistrer de fichiers."]}]},{id:"stops",title:"Quand quelque chose s\u2019arr\xEAte",lead:"La plupart des arr\xEAts se r\xE8glent d\u2019eux-m\xEAmes. La page dit lesquels.",blocks:[{terms:[{term:[{ui:"copy.status.waiting"}],text:["La lecture a perdu sa connexion \xE0 la base de donn\xE9es. Elle attend et r\xE9essaie d\u2019elle-m\xEAme, et la ligne affiche le nombre d\u2019essais. Si l\u2019attente dure, demandez \xE0 un administrateur de lancer ",{studio:"Diagnostiquer"}," sur le connecteur."]},{term:[{ui:"copy.status.failed"}],text:["La ligne affiche la derni\xE8re erreur. Corrigez la cause, puis ouvrez le menu \xE0 trois points de la ligne et choisissez ",{ui:"copy.readAgain"},". La lecture reprend l\xE0 o\xF9 elle s\u2019est arr\xEAt\xE9e. Elle ne relit pas les ensembles d\xE9j\xE0 termin\xE9s."]},{term:[{ui:"copy.status.completedSkipped"}],text:["Certaines cl\xE9s n\u2019ont pas pu \xEAtre lues. Elles sont r\xE9essay\xE9es \xE0 la fin de chaque passage et \xE0 chaque lancement de la lecture. Pour les r\xE9essayer tout de suite, choisissez ",{ui:"copy.readAgain"}," dans le menu de la ligne. Seules ces cl\xE9s sont relues depuis la base de donn\xE9es."]},{term:[{ui:"check.status.waiting"}],text:["Le serveur a eu une erreur de base de donn\xE9es. La v\xE9rification attend et relit la m\xEAme page, jusqu\u2019\xE0 5 fois. Vous n\u2019avez rien \xE0 faire."]},{term:[{ui:"check.status.failed"}],text:["La v\xE9rification s\u2019est arr\xEAt\xE9e, pour une erreur de base de donn\xE9es qui a persist\xE9 apr\xE8s 5 essais ou pour une autre cause. Un message affiche la derni\xE8re erreur. Corrigez la cause, puis choisissez ",{ui:"check.continue"},". Elle reprend l\xE0 o\xF9 elle s\u2019est arr\xEAt\xE9e."]},{term:["Le serveur a red\xE9marr\xE9"],text:["Vous n\u2019avez rien \xE0 faire. Une lecture reprend d\u2019elle-m\xEAme, et une v\xE9rification repart apr\xE8s deux minutes environ."]},{term:[{ui:"check.startError"}],text:["Le serveur a refus\xE9 le lancement, et le message dit pourquoi. Une v\xE9rification ne d\xE9marre que sur une source termin\xE9e, avec une r\xE9f\xE9rence termin\xE9e ou sans r\xE9f\xE9rence. Apr\xE8s une mise \xE0 jour du plugin qui change ce qui est lu, il faut d\u2019abord relire la source. Voir ",{see:"after-fix",text:"Apr\xE8s une correction du plugin"},"."]},{term:[{ui:"run.actionError"}],text:["Une source ou la r\xE9f\xE9rence ne peut \xEAtre ni relue ni supprim\xE9e pendant qu\u2019une v\xE9rification qui l\u2019utilise tourne. Attendez la fin de la v\xE9rification, ou arr\xEAtez-la dans l\u2019onglet ",{ui:"tab.check"},"."]},{term:[{ui:"check.referencesMany"}],text:["Cela n\u2019arrive que l\xE0 o\xF9 des r\xE9f\xE9rences ont \xE9t\xE9 ajout\xE9es avant qu\u2019un site ne puisse en avoir une seule. L\u2019onglet ne choisit pas entre elles."]},{term:[{ui:"check.noOps"}],text:["Demandez \xE0 un administrateur de mettre OpenLDR \xE0 jour."]},{term:[{ui:"copy.allTaken"}],text:["Le menu propose toujours ",{ui:"copy.new"},", mais son panneau ne liste aucun connecteur. Il dit que chaque connecteur autoris\xE9 est utilis\xE9. Supprimez-en une, ou demandez \xE0 un administrateur d\u2019autoriser un autre connecteur."]}]}]},{id:"after-fix",title:"Apr\xE8s une correction du plugin",lead:"Quand une nouvelle version du plugin corrige le d\xE9codage des demandes ou les r\xE8gles qui les retiennent, relancez la v\xE9rification sur la m\xEAme source. La source n\u2019est pas relue. Une nouvelle version qui change ce que lit le plugin, c\u2019est autre chose : une v\xE9rification refuse la source tant qu\u2019elle n\u2019a pas \xE9t\xE9 relue depuis sa base de donn\xE9es. Seuls les ensembles dont les instructions ont chang\xE9 sont relus.",blocks:[{steps:[["Demandez \xE0 un administrateur d\u2019installer la nouvelle version du plugin."],["Ouvrez l\u2019onglet ",{ui:"tab.check"},"."],["Sous ",{ui:"check.source"},", choisissez la source."],["Ouvrez le menu \xE0 trois points de la ligne des onglets et choisissez ",{ui:"check.restart"},"."]]},{result:["la v\xE9rification repasse sur la m\xEAme source. Une demande qui passe maintenant est enregistr\xE9e."]},{para:["Si le lancement est refus\xE9 parce que la source doit \xEAtre relue, ouvrez l\u2019onglet ",{ui:"tab.copy"},". Dans le menu \xE0 trois points de la ligne, choisissez ",{ui:"copy.readAgain"},". La page demande ",{ui:"copy.rereadTitle"}," et liste les ensembles dont les instructions ont chang\xE9. Choisissez ",{ui:"copy.rereadYes"}," pour confirmer. Cela supprime les lignes lues de ces ensembles et les relit depuis la base de donn\xE9es. Pour une grande base, cela peut prendre des heures, voire des jours. Quand la source affiche ",{ui:"copy.status.completed"},", relancez la v\xE9rification."]}]}]};var B1={title:"O que esta p\xE1gina faz",summary:"Esta p\xE1gina l\xEA as bases de dados de origem de um laborat\xF3rio para este servidor, verifica cada pedido e lista os pedidos que a verifica\xE7\xE3o reteve. Um administrador de laborat\xF3rio usa-a para trazer para o OpenLDR os pedidos antigos de um laborat\xF3rio. O servidor faz o trabalho, por isso pode sair da p\xE1gina enquanto uma origem \xE9 lida ou uma verifica\xE7\xE3o decorre.",tasksLabel:"Tarefas",resultLabel:"Resultado esperado:",sections:[{id:"before",title:"Antes de come\xE7ar",lead:"Um administrador prepara isto uma vez no studio. Precisa da fun\xE7\xE3o lab_admin para abrir esta p\xE1gina.",blocks:[{para:["Este plugin l\xEA dois tipos de base de dados de origem, a de um sistema de laborat\xF3rio e a do OpenLDR v1. S\xF3 descodifica um sistema de laborat\xF3rio para os locais para os quais tem um perfil. Hoje tem um perfil: ",{ui:"check.site.tanzania"},". Um local de sistema de laborat\xF3rio sem perfil n\xE3o pode ser verificado at\xE9 ser acrescentado um perfil ao plugin."]},{steps:[["Adicione um conector SQL Server para a base de dados de cada sistema de laborat\xF3rio, e um para uma base de dados OpenLDR v1 que queira importar. Cada um passa a ser uma origem."],["Se o local tiver um reposit\xF3rio antigo, adicione tamb\xE9m um conector SQL Server para ele. Passa a ser a refer\xEAncia."],["Abra ",{studio:"Defini\xE7\xF5es"}," e depois ",{studio:"Conectores"},"."],["No menu da linha de cada conector, escolha ",{studio:"Acesso de plugins"}," e autorize este plugin."]]},{result:["os conectores aparecem em ",{ui:"source.label"}," quando adiciona uma origem ou refer\xEAncia."]},{para:["Cada conector cont\xE9m uma origem ou uma refer\xEAncia. Para recome\xE7ar num conector, remova primeiro o que ele cont\xE9m."]}]},{id:"copy-source",title:"Adicionar uma origem",lead:"Comece por aqui. Uma verifica\xE7\xE3o precisa de uma origem terminada.",blocks:[{steps:[["Abra o separador ",{ui:"tab.copy"},"."],["Abra o menu de tr\xEAs pontos no fim da linha dos separadores e escolha ",{ui:"copy.new"},"."],["Em ",{ui:"source.label"},", escolha o conector da base de dados do sistema do laborat\xF3rio."],["Em ",{ui:"options.role"},", escolha ",{ui:"options.role.source"},". Em ",{ui:"options.kind"},", escolha ",{ui:"options.kind.labSystem"},"."],["Deixe ",{ui:"options.dataDb"},", ",{ui:"options.globalDb"}," e ",{ui:"options.dictDb"}," vazios para usar os nomes predefinidos do plugin, ou escreva os nomes que o seu local usa."],["Para testar primeiro a liga\xE7\xE3o, abra o menu de tr\xEAs pontos no topo do painel e escolha ",{ui:"source.check"},"."],["Abra o menu de tr\xEAs pontos no topo do painel e escolha ",{ui:"copy.start"},"."]]},{result:["o painel fecha e a origem aparece como uma linha da tabela. O ",{ui:"copy.col.status"}," passa a ",{ui:"copy.status.running"}," e depois a ",{ui:"copy.status.completed"},"."]},{para:["Ler uma base de dados grande pode levar horas ou dias. Pode fechar a p\xE1gina e a leitura continua. Para ver cada conjunto de linhas lido, abra o menu de tr\xEAs pontos da linha e escolha ",{ui:"copy.open"},"."]},{para:["Adicione uma origem para cada sistema de laborat\xF3rio do local. Cada uma \xE9 comparada com a \xFAnica refer\xEAncia do local."]}]},{id:"copy-v1",title:"Adicionar uma origem OpenLDR v1",lead:"Use isto para importar da pr\xF3pria base de dados OpenLDR v1. Uma origem OpenLDR v1 n\xE3o \xE9 comparada com nada. Um local com refer\xEAncia n\xE3o pode ter uma. Salte esta tarefa se o local tiver refer\xEAncia.",blocks:[{steps:[["Abra o separador ",{ui:"tab.copy"},"."],["Abra o menu de tr\xEAs pontos no fim da linha dos separadores e escolha ",{ui:"copy.new"},"."],["Em ",{ui:"source.label"},", escolha o conector da base de dados OpenLDR v1."],["Em ",{ui:"options.role"},", escolha ",{ui:"options.role.source"},". Em ",{ui:"options.kind"},", escolha ",{ui:"options.kind.openldrV1"},". Se n\xE3o puder ser escolhido, a linha por baixo diz porqu\xEA."],["Deixe ",{ui:"options.database"}," vazio para usar ",{code:"OpenLDRData"},", ou escreva o nome da base de dados."],["As duas tabelas s\xE3o lidas por predefini\xE7\xE3o. Desligue ",{ui:"options.hasPatients"}," ou ",{ui:"options.hasAst"}," quando a base de dados n\xE3o tiver essa tabela."],["Abra o menu de tr\xEAs pontos no topo do painel e escolha ",{ui:"copy.start"},"."]]},{result:["o painel fecha e a origem aparece como uma linha da tabela. A coluna ",{ui:"copy.col.kind"}," mostra ",{ui:"options.kind.openldrV1"},", e o ",{ui:"copy.col.status"}," passa a ",{ui:"copy.status.running"}," e depois a ",{ui:"copy.status.completed"},"."]},{para:["Se a leitura falhar porque falta uma tabela, a linha mostra o erro e esta frase: ",{ui:"copy.v1ReadHint"}," Para remover a origem, abra o menu de tr\xEAs pontos da linha e escolha ",{ui:"copy.delete"},"."]},{para:["Uma verifica\xE7\xE3o desta origem n\xE3o a compara, por isso a Distribui\xE7\xE3o indica ",{ui:"check.v1NotCompared"}," e lista apenas os pedidos retidos. Um pedido com as datas fora de ordem fica retido. Aparece no separador ",{ui:"tab.held"},", com uma constata\xE7\xE3o que indica as datas."]}]},{id:"copy-reference",title:"Adicionar a refer\xEAncia",lead:"A refer\xEAncia \xE9 o OpenLDR v1, o reposit\xF3rio antigo. Cont\xE9m os mesmos pedidos, e a verifica\xE7\xE3o compara com ela os pedidos de cada origem. Salte esta tarefa se o local n\xE3o tiver reposit\xF3rio antigo.",blocks:[{steps:[["No separador ",{ui:"tab.copy"},", abra o menu de tr\xEAs pontos da linha dos separadores e escolha ",{ui:"copy.new"},"."],["Em ",{ui:"source.label"},", escolha o conector do reposit\xF3rio antigo."],["Em ",{ui:"options.role"},", escolha ",{ui:"options.role.reference"},". Em ",{ui:"options.kind"},", ",{ui:"options.kind.openldrV1"}," \xE9 a \xFAnica escolha."],["Deixe ",{ui:"options.v1Db"}," vazio para usar o nome predefinido do plugin, ou escreva o nome."],["Em ",{ui:"options.requestIdPrefix"},", escreva o in\xEDcio dos identificadores dos pedidos a ler, por exemplo ",{code:"ABC"},"."],["Abra o menu de tr\xEAs pontos no topo do painel e escolha ",{ui:"copy.start"},"."]]},{result:["uma nova linha mostra ",{ui:"check.reference"}," na coluna ",{ui:"copy.col.role"},"."]},{para:["Um local tem no m\xE1ximo uma refer\xEAncia. Se ",{ui:"options.role.reference"}," n\xE3o puder ser escolhida, a linha por baixo diz porqu\xEA. Sem refer\xEAncia, nada \xE9 comparado, e um pedido que n\xE3o fica retido recebe a etiqueta ",{ui:"label.unchecked"},". Um local com uma origem OpenLDR v1 n\xE3o pode ter refer\xEAncia."]}]},{id:"run-check",title:"Executar uma verifica\xE7\xE3o",lead:"A verifica\xE7\xE3o l\xEA uma origem terminada e faz o plugin descodificar cada pedido. Guarda os pedidos que passam e ret\xE9m os restantes.",blocks:[{steps:[["Abra o separador ",{ui:"tab.check"},"."],["Em ",{ui:"check.source"},", escolha a origem. S\xF3 aparecem as origens terminadas. Pode escolher outra enquanto uma verifica\xE7\xE3o decorre, para ver a verifica\xE7\xE3o dela."],["Por baixo, ",{ui:"check.reference"}," indica a refer\xEAncia do local. Se n\xE3o houver, a linha diz ",{ui:"check.referenceNone"}," N\xE3o escolhe a refer\xEAncia: cada verifica\xE7\xE3o usa a \xFAnica refer\xEAncia do local."],["Abra o menu de tr\xEAs pontos da linha dos separadores e escolha ",{ui:"check.settings"},"."],["Em ",{ui:"check.opt.site"},", escolha o perfil do seu local. A p\xE1gina s\xF3 mostra os perfis que o plugin tem."],["Escreva o ",{ui:"check.opt.labCode"},". Cada origem tem o seu pr\xF3prio c\xF3digo. O ",{ui:"check.opt.labName"}," \xE9 opcional."],["Em ",{ui:"check.opt.tz"},", escreva a diferen\xE7a do laborat\xF3rio em rela\xE7\xE3o a UTC, por exemplo ",{code:"+03:00"},"."],["Confirme que ",{ui:"check.opt.requestIdPrefix"}," \xE9 o prefixo com que a refer\xEAncia foi lida. A p\xE1gina preenche-o a partir da refer\xEAncia."],["Abra o menu de tr\xEAs pontos no topo do painel e escolha ",{ui:"check.start"},"."]]},{result:["a linha de estado mostra ",{ui:"check.status.running"}," e quantos pedidos foram lidos, e depois ",{ui:"check.status.completed"},"."]},{para:["Para uma origem OpenLDR v1, o campo ",{ui:"check.reference"}," mostra ",{ui:"check.referenceNotApplicable"}," e n\xE3o pode ser alterado, e as defini\xE7\xF5es pedem apenas o ",{ui:"check.opt.tz"},"."]},{para:["Se o reposit\xF3rio antigo escrever o local de atendimento a come\xE7ar pelo distrito, escolha ",{ui:"check.poc.district_facility_ward"}," em ",{ui:"check.opt.pocFormat"}," antes de iniciar."]},{para:["Para parar uma verifica\xE7\xE3o, abra o menu de tr\xEAs pontos da linha dos separadores e escolha ",{ui:"check.stop"},". A verifica\xE7\xE3o acaba a p\xE1gina de pedidos em curso e depois fica parada."]},{para:["Quando uma verifica\xE7\xE3o terminou, o menu mostra ",{ui:"check.restart"}," em vez de ",{ui:"check.start"},". A verifica\xE7\xE3o corre de novo sobre a mesma origem, com as op\xE7\xF5es do formul\xE1rio. A base de dados de origem n\xE3o \xE9 lida de novo. Um pedido que passa desta vez \xE9 guardado e sai da lista de retidos."]},{para:["Quando uma verifica\xE7\xE3o parou ou falhou, o menu mostra ",{ui:"check.continue"}," e ",{ui:"check.restartFromFirst"},". ",{ui:"check.continue"}," continua de onde a verifica\xE7\xE3o parou, e mant\xE9m as contagens e os pedidos retidos. ",{ui:"check.restartFromFirst"}," come\xE7a no primeiro pedido, com contagens novas. Uma verifica\xE7\xE3o tamb\xE9m come\xE7a no primeiro pedido quando as op\xE7\xF5es ou a refer\xEAncia mudaram, ou quando a origem ou a refer\xEAncia foi lida de novo. Depois de iniciar, o separador diz o que aconteceu."]}]},{id:"read-counts",title:"Ler as contagens",lead:"As contagens abrangem toda a origem, ou um s\xF3 laborat\xF3rio quando escolhe um.",blocks:[{para:["O seletor ",{ui:"check.lab.label"}," aparece por cima das contagens s\xF3 quando o OpenLDR fornece as contagens de cada laborat\xF3rio. Abra-o para procurar e escolher um laborat\xF3rio no computador ou no telem\xF3vel. Escolha ",{ui:"check.lab.all"}," para os totais de toda a origem. ",{ui:"check.lab.unassigned"}," agrupa os pedidos sem c\xF3digo de laborat\xF3rio. Sem essas contagens, a p\xE1gina mostra os totais de toda a origem, sem seletor."]},{terms:[{term:[{ui:"check.count.read"}],text:["O n\xFAmero de pedidos que a verifica\xE7\xE3o j\xE1 leu da origem."]},{term:[{ui:"check.count.saved"}],text:["Estes pedidos passaram e est\xE3o guardados no OpenLDR."]},{term:[{ui:"check.count.held"}],text:["Estes pedidos n\xE3o s\xE3o guardados. Cada um fica, com o motivo, no separador ",{ui:"tab.held"},"."]},{term:[{ui:"check.count.failed"}],text:["O plugin n\xE3o conseguiu descodificar estes pedidos, ou o OpenLDR n\xE3o conseguiu guard\xE1-los. Um pedido que o plugin n\xE3o conseguiu descodificar aparece no separador ",{ui:"tab.held"}," com um c\xF3digo de erro."]}]},{para:["A ",{ui:"check.labelsHeading"}," separa os pedidos pelo que a verifica\xE7\xE3o encontrou:"]},{terms:[{term:[{ui:"label.passed"}],text:["As regras n\xE3o encontraram nenhum erro, e o pedido \xE9 igual \xE0 refer\xEAncia."]},{term:[{ui:"label.unchecked"}],text:["As regras n\xE3o encontraram nenhum erro, e o pedido \xE9 guardado. N\xE3o foi comparado: o local n\xE3o tem refer\xEAncia, ou a refer\xEAncia n\xE3o tem um pedido correspondente."]},{term:[{ui:"label.held_rules"}],text:["As regras do plugin encontraram um erro no pedido."]},{term:[{ui:"label.held_check"}],text:["O pedido \xE9 diferente da refer\xEAncia."]},{term:[{ui:"label.held_both"}],text:["As regras encontraram um erro, e o pedido \xE9 diferente da refer\xEAncia."]},{term:[{ui:"label.other"}],text:["As restantes etiquetas, contadas em conjunto."]}]},{para:["Um pedido gravado pode ainda ter constata\xE7\xF5es que n\xE3o o retiveram: um aviso ou uma nota. O OpenLDR guarda-as com o pedido, em dois atributos de pedido: v1-flags indica os tipos de constata\xE7\xE3o, e v1-findings cont\xE9m cada constata\xE7\xE3o completa. Use-os para encontrar pedidos gravados que merecem nova an\xE1lise."]}]},{id:"held",title:"Tratar os pedidos retidos",lead:"Fa\xE7a isto depois de uma verifica\xE7\xE3o, para ver porque \xE9 que cada pedido ficou retido.",blocks:[{steps:[["Abra o separador ",{ui:"tab.held"},"."],["Na primeira lista por cima da tabela, escolha a origem."],["Para ver s\xF3 um motivo, escolha-o na segunda lista, por exemplo ",{ui:"label.held_check"}," ou ",{ui:"held.filter.error"},". Quando o OpenLDR conta por laborat\xF3rio, uma terceira lista, ",{ui:"check.lab.label"},", mostra os pedidos de um s\xF3 laborat\xF3rio."],["Escolha um identificador na coluna ",{ui:"held.col.request"},"."],["Leia as ",{ui:"held.findings"},". Cada uma tem uma gravidade, uma mensagem e os valores encontrados."],["Leia ",{ui:"held.check"},". Os campos diferentes aparecem primeiro."],["Para esconder os campos iguais, marque ",{ui:"held.onlyDiff"},"."]]},{result:["o painel mostra porque \xE9 que o pedido ficou retido e onde difere da refer\xEAncia. Feche o painel para voltar \xE0 mesma linha."]},{para:["Em ",{ui:"held.results"},", cada resultado de an\xE1lise \xE9 comparado da mesma forma, com as diferen\xE7as primeiro. Enquanto uma verifica\xE7\xE3o decorre, a lista \xE9 lida de novo automaticamente. Para a ler j\xE1, abra o menu de tr\xEAs pontos da linha dos separadores e escolha ",{ui:"held.refresh"},"."]},{para:["Para corrigir um campo, abra o menu de pontos da folha e escolha ",{ui:"held.correct.open"},". Cada campo mostra o seu valor como lido. Mude os valores, d\xEA um motivo e escolha ",{ui:"held.correct.save"}," no mesmo menu. As linhas da fonte n\xE3o mudam. O pedido s\xF3 \xE9 gravado se passar as regras. Uma pessoa com a permiss\xE3o Corrigir pedidos retidos v\xEA apenas este separador."]}]},{id:"share",title:"Partilhar o que ficou retido",lead:"Cada exporta\xE7\xE3o guarda um ficheiro CSV. Abra o menu de tr\xEAs pontos, escolha a exporta\xE7\xE3o e guarde o ficheiro. As exporta\xE7\xF5es dos pedidos retidos seguem as listas por cima da tabela. Com um laborat\xF3rio escolhido, o nome do ficheiro tem o seu c\xF3digo. Enquanto a verifica\xE7\xE3o da origem decorre, a p\xE1gina recusa estas exporta\xE7\xF5es: espere que termine, ou pare-a.",blocks:[{terms:[{term:[{ui:"export.summary"}],text:["No menu do separador ",{ui:"tab.check"},". As quatro contagens, a distribui\xE7\xE3o, o estado, as horas de in\xEDcio e de fim, a origem, a refer\xEAncia e as op\xE7\xF5es da verifica\xE7\xE3o. Esta exporta\xE7\xE3o abrange sempre toda a origem, mesmo quando um s\xF3 laborat\xF3rio est\xE1 selecionado. Quando o OpenLDR conta por laborat\xF3rio, junta uma linha por laborat\xF3rio."]},{term:[{ui:"export.list"}],text:["No menu do separador ",{ui:"tab.held"},". Uma linha por pedido retido no motivo e no laborat\xF3rio escolhidos: o identificador, o motivo, o c\xF3digo de erro e quando ficou retido."]},{term:[{ui:"export.page"}],text:["No menu do separador ",{ui:"tab.held"},". As constata\xE7\xF5es dos pedidos da p\xE1gina que est\xE1 a ver, s\xF3 com os campos e resultados diferentes."]},{term:[{ui:"export.all"}],text:["No menu do separador ",{ui:"tab.held"},". O mesmo, para todos os pedidos retidos no motivo e no laborat\xF3rio escolhidos. Acima de 50 000 pedidos, a p\xE1gina pergunta primeiro. Escolha ",{ui:"export.bigYes"}," para continuar, ou ",{ui:"copy.cancel"}," para parar. Enquanto a exporta\xE7\xE3o l\xEA, o menu de tr\xEAs pontos mostra ",{ui:"export.cancel"},". Escolha-o para parar. Nesse caso nada \xE9 guardado."]},{term:[{ui:"export.request"}],text:["No menu de tr\xEAs pontos de um pedido aberto. As suas constata\xE7\xF5es, e todos os campos e resultados da verifica\xE7\xE3o, incluindo os que coincidem."]}]},{para:["Estes ficheiros cont\xEAm dados de doentes. Guarde-os como guarda qualquer processo cl\xEDnico, e partilhe-os s\xF3 com quem tem autoriza\xE7\xE3o para os ver."]},{para:["Se o menu n\xE3o mostrar nenhuma exporta\xE7\xE3o, este OpenLDR ainda n\xE3o consegue guardar ficheiros."]}]},{id:"stops",title:"Quando algo para",lead:"A maioria das paragens resolve-se sozinha. A p\xE1gina diz quais.",blocks:[{terms:[{term:[{ui:"copy.status.waiting"}],text:["A leitura perdeu a liga\xE7\xE3o \xE0 base de dados. Espera e volta a tentar sozinha, e a linha mostra as t
